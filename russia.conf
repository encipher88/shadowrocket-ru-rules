# version: 4

[General]
bypass-system = true
ipv6 = false
prefer-ipv6 = false
private-ip-answer = true
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53, 9.9.9.9:53, 149.112.112.112:53, 208.67.222.222:53, 208.67.220.220:53
skip-proxy = 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32, localhost, *.local, captive.apple.com
tun-excluded-routes = 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.88.99.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
bypass-tun = 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.168.0.0/16, 224.0.0.0/4, 255.255.255.255/32
# DoH only — must go via PROXY (see rules below), not via CF Moscow DIRECT
dns-server = https://dns.google/dns-query, https://cloudflare-dns.com/dns-query
fallback-dns-server = 8.8.8.8, 1.1.1.1

[Rule]
# DNS resolvers — always PROXY (else GEOIP RU sends CF Moscow edge DIRECT → 172.68.x)
DOMAIN-SUFFIX,dns.google,PROXY
DOMAIN-SUFFIX,cloudflare-dns.com,PROXY
DOMAIN-SUFFIX,one.one.one.one,PROXY
IP-CIDR,8.8.8.8/32,PROXY
IP-CIDR,8.8.4.4/32,PROXY
IP-CIDR,1.1.1.1/32,PROXY
IP-CIDR,1.0.0.1/32,PROXY
IP-CIDR,9.9.9.9/32,PROXY

# WebRTC / STUN
DOMAIN-KEYWORD,stun.,REJECT
DOMAIN-KEYWORD,turn.,REJECT
DOMAIN-SUFFIX,stunprotocol.org,REJECT
DOMAIN,stun.l.google.com,REJECT
DOMAIN,stun1.l.google.com,REJECT
DOMAIN,stun2.l.google.com,REJECT
DOMAIN,stun3.l.google.com,REJECT
DOMAIN,stun4.l.google.com,REJECT
DOMAIN,stun.cloudflare.com,REJECT
DOMAIN,global.stun.twilio.com,REJECT
DOMAIN,stun.services.mozilla.com,REJECT

# Custom DIRECT (before ru-blocked)
DOMAIN,zagonka8.zagonkov.gb.net,DIRECT
DOMAIN-SUFFIX,zagonkov.gb.net,DIRECT

RULE-SET,https://raw.githubusercontent.com/sub-kek/shadowrocket-lists/refs/heads/master/shadowrocket/category-ads-all.list,REJECT-DROP
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geoip/geoip-private.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-ru-blocked.list,PROXY
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geoip/geoip-ru-blocked.list,PROXY
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geosite/geosite-category-ru.list,DIRECT
DOMAIN-SUFFIX,ru,DIRECT
DOMAIN-SUFFIX,su,DIRECT
DOMAIN-SUFFIX,xn--p1ai,DIRECT
GEOIP,RU,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/Master-Yoba/shadowrocket-rules/release/rules-geoip/geoip-ru.list,DIRECT
FINAL,PROXY
